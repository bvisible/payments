{% extends "templates/web.html" %}

<!-- //// Neoffice — the link printed `redirect_to` as it came: a script, or a way off the site. The
     controller hands a value that stays on this site, escaped here. Outside any block, so never sent. -->

{% block title %}{{ _("Payment Failed") }}{% endblock %}

{%- block page_content -%}
<div class='page-card'>
	<div class='page-card-head'>
		<span class='indicator red'>
			{{ _("Payment Failed") }}</span>
	</div>
	<p>{{ _("Your payment has failed.") }}</p>
	{# //// Neoffice — values from the link were printed raw: escaped now. #}
	<div><a href="{{ (redirect_to or "/") | e }}" class='btn btn-primary btn-sm'>
		{{ _("Continue") }}</a></div>
</div>
<style>
.hero-and-content {
	background-color: #f5f7fa;
}
{% include "templates/styles/card_style.css" %}
</style>

{% endblock %}
