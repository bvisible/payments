{% extends "templates/web.html" %}

<!-- //// Neoffice — the template printed `redirect_to` as it came, in a link and in a script, and nothing
     escapes a page here: a link could run a script on the ERP's origin or send a buyer off the site after
     4 seconds. `payment_success.py` hands a value that stays on this site, and each place escapes it its
     own way. Outside any block, so this comment never reaches the page. -->

{% block title %}{{ _("Payment Success") }}{% endblock %}

{%- block page_content -%}
<div class='page-card'>
	<div class='page-card-head'>
		<span class='indicator green'>
			{{ _("Success") }}</span>
	</div>
	<p>{{ payment_message or _("Your payment was successfully accepted") }}</p>
	{% if not payment_message %}
		<div>
			<a
			   {# //// Neoffice — values from the link were printed raw, and redirect_to could leave the site: see payment_success.py. #}
			   href="{{ (redirect_to or "/") | e }}"
			   class='btn btn-primary btn-sm'>
				{{ _("Continue") }}
			</a>
		</div>
	{% endif %}
</div>
<style>
{% include "templates/styles/card_style.css" %}
</style>
<script>
	frappe.ready(function() {
		{# //// Neoffice — values from the link were printed raw, and redirect_to could leave the site: see payment_success.py. #}
		var redirect_to = {{ (redirect_to or "") | tojson }};
		if(redirect_to){
			setTimeout(function(){
				{# //// Neoffice — values from the link were printed raw, and redirect_to could leave the site: see payment_success.py. #}
				window.location.href = redirect_to;
			}, 4000);
		}
	})
</script>
{% endblock %}
