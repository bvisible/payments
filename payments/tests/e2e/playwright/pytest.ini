[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test
python_functions = test_*
markers =
    smoke: quick sanity tests
    checkout: full checkout flow
    psp_stripe: Stripe-specific
    psp_wallee: Wallee-specific
    psp_twint: TWINT-specific
    edge: edge cases (re-checkout, change PSP, declined card)
    slow: slow tests (Wallee redirect, TWINT polling)
addopts =
    -v
    --tb=short
    --strict-markers
    --base-url=https://osiris.neoffice.me
    --browser=chromium
    --reruns=2
    --reruns-delay=8
