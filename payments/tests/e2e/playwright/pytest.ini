#//// Neoffice — added file (no upstream equivalent). pytest config for the suite: rootdir, the
#//// `test_*.py` pattern, and the markers the README documents (smoke, checkout,
#//// psp_stripe, …) so a run can be narrowed to one PSP.
#//// Commits: 187b5c8 2026-05-20 "add Playwright Python suite".
[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test
python_functions = test_*
markers =
    smoke: quick sanity tests
    checkout: full checkout flow
    psp_stripe: Stripe-specific
    psp_wallee: Wallee-specific
    psp_twint: TWINT-specific
    psp_payrexx: Payrexx-specific
    edge: edge cases (re-checkout, change PSP, declined card)
    slow: slow tests (Wallee redirect, TWINT polling)
    b2b: B2B checkout flow (customer group + pricing rule)
addopts =
    -v
    --tb=short
    --strict-markers
    --base-url=https://osiris.neoffice.me
    --browser=chromium
    --reruns=2
    --reruns-delay=8
