[project]
name = "payments"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "hello@frappe.io"}
]
description = "Payments app for frappe"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "paytmchecksum~=1.7.0",
    "razorpay~=1.4.2",
    # //// Neoffice — upstream pins `stripe~=10.12.0`. Raised to 11.6 for Terminal in
    # //// server-driven mode (0efe5ef, 2026-05-13 "Phase 2"): the reader is driven from
    # //// the server through `stripe.terminal.Reader.process_payment_intent`, which the
    # //// 10.x client does not expose (ADR-003). TO REVIEW at merge: upstream may have
    # //// moved this pin on its own since.
    "stripe~=11.6.0",
    "braintree~=4.20.0",
    "pycryptodome>=3.18.0,<4.0.0",
    "gocardless-pro~=1.22.0",
    # //// Neoffice — the three dependencies below are ours: upstream's list ends at
    # //// gocardless-pro. `wallee` (49af519, 2026-05-18) and `payrexx` (4c05756,
    # //// 2026-08-11) are the Swiss acceptance platforms this fork adds and upstream has
    # //// no notion of. The payrexx one is a git URL because Payrexx publishes no
    # //// official Python SDK — the repo behind it is ours.
    "wallee>=6.4.0",
    # Payrexx client — no official Python SDK exists, so this is ours:
    # https://github.com/neoserviceai/payrexx-python
    "payrexx @ git+https://github.com/neoserviceai/payrexx-python.git@main",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"
