[project]
name = "payments"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "hello@frappe.io"}
]
description = "Payments app for frappe"
requires-python = ">=3.10,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "paytmchecksum~=1.7.0",
    "razorpay~=2.0.0",
    # //// Neoffice — upstream pins `stripe~=10.12.0` (still so at its version-15 of 05.11.2026). Raised to 11.6 for
    # //// Terminal in server-driven mode (0efe5ef, 2026-05-13 "Phase 2"): the reader is driven from the server
    # //// through `stripe.terminal.Reader.process_payment_intent`, which the 10.x client does not expose (ADR-003).
    "stripe~=11.6.0",
    "braintree~=4.20.0",
    "pycryptodome>=3.18.0,<4.0.0",
    "gocardless-pro~=1.22.0",
    # //// Neoffice — the three dependencies below are ours: upstream's list ends at
    # //// gocardless-pro. `wallee` (49af519, 2026-05-18) and `payrexx` (4c05756,
    # //// 2026-08-11) are the Swiss acceptance platforms this fork adds and upstream has
    # //// no notion of. The payrexx one is a git URL because Payrexx publishes no
    # //// official Python SDK — the repo behind it is ours.
    # //// Neoffice — wallee 7.0.0 (2026-10-28) no longer has `wallee.models.PaymentTerminalCreate`, which the
    # //// terminal wizard builds its request from (payments/integrations/wallee/api.py, maintenance#1730): a fresh
    # //// install resolved ">=6.4.0" to it and the wizard's tests broke. Stay on the 6.x series; lift the cap when
    # //// the wizard is ported to the 7.x models.
    "wallee>=6.4.0,<7",
    # Payrexx client — no official Python SDK exists, so this is ours:
    # https://github.com/neoserviceai/payrexx-python
    "payrexx @ git+https://github.com/neoserviceai/payrexx-python.git@main",
    # //// Neoffice — the TWINT drivers draw the QR of a payment with `qrcode` (twint/web_driver.py, _pairing_token_to_svg).
    # //// It was never declared: a bench had it only through erpnextswiss's qrbill, and on a site without it (this app's own CI)
    # //// the QR came out empty, which the phone's suite measured once it stopped skipping (maintenance#629).
    "qrcode>=7.4",
    # //// Neoffice — upstream also pins `setuptools==84.2.1` here (e0a722b, 5dbcf82), left out on purpose: a runtime
    # //// pin in the bench's shared environment moves setuptools for every app, and 84 no longer ships
    # //// `pkg_resources`, which passlib (`passlib/pwd.py`) and razorpay 1.4.2 import at the top of a module (osiris,
    # //// 13.11.2026). Upstream added it so razorpay 1.x found `pkg_resources`; razorpay 2.0 (taken above) no longer
    # //// needs it. Take it when the fleet's benches no longer import `pkg_resources`.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[project.urls]
Repository = "https://github.com/frappe/payments.git"
"Bug Reports" = "https://github.com/frappe/payments/issues"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
